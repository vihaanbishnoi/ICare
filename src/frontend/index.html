<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ICare: pose-based fall detection research. Live camera and recorded-video inference with YOLO26n-pose and PoseC3D." />
    <meta name="color-scheme" content="light dark" />
    <title>ICare</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a remembered theme before first paint; otherwise CSS follows the system.
      try {
        var theme = localStorage.getItem('icare-theme');
        // Light is the default; dark only when the person chose it.
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
