name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python -m tools.check_repository

  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

  container:
    name: Compose stack end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Builds both images (pose weights baked in), runs a real example job
      # through nginx, and checks ownership, origin and single-OpenCV packaging.
      - name: Build and start
        env:
          ICARE_ALLOW_UNVERIFIED_EXAMPLES: "1"
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Single OpenCV distribution
        run: >-
          docker compose exec -T api python -c "import importlib.metadata as m;
          cv=[d.metadata['Name'] for d in m.distributions() if d.metadata['Name'].startswith('opencv')];
          assert cv == ['opencv-python-headless'], cv"
      - name: Smoke test
        run: deployment/smoke_test.sh http://127.0.0.1:7860
      - name: Logs
        if: always()
        run: docker compose logs --tail 200 api web || true
