name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python -m tools.check_repository

  tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

  container:
    name: API container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pose weights are not downloaded in CI, so the engine is expected to
      # report not ready; this checks packaging, startup and the API contract.
      - name: Build image
        run: docker build -f deployment/Dockerfile --build-arg PRELOAD_MODELS=0 -t icare-api:ci .
      - name: Start and probe
        run: |
          docker run -d --name icare -p 127.0.0.1:8000:8000 icare-api:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/ready)" = 503
          curl -sf http://127.0.0.1:8000/api/v1/examples
          docker exec icare python -c "import importlib.metadata as m; cv=[d.metadata['Name'] for d in m.distributions() if d.metadata['Name'].startswith('opencv')]; assert cv == ['opencv-python-headless'], cv"
          docker exec icare python -c "from icare_app.engine import EngineConfig; from icare_app import engine_model as em; s = EngineConfig.from_mapping({'model_path': '/app/models/posec3d_fall.onnx', 'device': 'cpu'}); em.OnnxTemporalClassifier.load(s.model_path, em.load_metadata(s)).close()"
      - name: Logs
        if: always()
        run: docker logs icare || true
