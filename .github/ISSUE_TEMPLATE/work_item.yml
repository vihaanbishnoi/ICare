name: Work item
description: A development or deployment task
title: "[Task] "
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Responsibility
      options:
        - Development engine API frontend and evaluation
        - Deployment hosting HTTPS operations and live release
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Problem and intended outcome
      description: Describe one concrete behavior or deliverable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results and the tests or evidence required.
      placeholder: "- [ ] Expected behavior is demonstrated by a named test or recording."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Files and shared interfaces
      description: Identify files and affected interface agreements.
  - type: dropdown
    id: strategy
    attributes:
      label: Component strategy
      options:
        - Reuse existing useful component
        - Refactor existing component
        - Replace prototype component
        - Build a new product component
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues and decisions. Identify development or deployment ownership.
