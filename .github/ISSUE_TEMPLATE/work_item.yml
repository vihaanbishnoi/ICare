name: Work item
description: A scoped task for a chosen Person 1 through Person 5 part
title: "[Task] "
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Numbered part
      options:
        - Person 1 Inference engine and model runtime
        - Person 2 API jobs incidents and private results
        - Person 3 Public frontend and demo experience
        - Person 4 Evaluation benchmarks and research evidence
        - Person 5 Deployment security integration and release
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Problem and intended outcome
      description: Describe one concrete behavior or deliverable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results and the tests or evidence required.
      placeholder: "- [ ] Expected behavior is demonstrated by a named test or recording."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Files and shared interfaces
      description: Identify files, adjacent numbered parts, and interface agreements.
  - type: dropdown
    id: strategy
    attributes:
      label: Component strategy
      options:
        - Reuse existing useful component
        - Refactor existing component
        - Replace prototype component
        - Build a new product component
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues and decisions. Assign the teammate who chose this part; Person 5 tracks integration.
