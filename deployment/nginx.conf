server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, never append: the API trusts this header for per-network
        # admission limits, so a client-supplied value must not pass through.
        # Behind another HTTPS proxy, set real_ip_header/set_real_ip_from first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }
    # Vite fingerprints everything under /assets/, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # index.html must be revalidated, or a returning browser keeps referencing
    # asset hashes that the newly deployed image no longer contains.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
